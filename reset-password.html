<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CVhive</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a56db;
            --secondary: #f5a623;
            --accent: #00c49a;
            --gray-100: #f1f4f8;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gray-100);
            color: var(--gray-600);
            line-height: 1.6;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .logo-svg {
            height: 45px;
            width: 45px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--gray-600);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .success-message {
            color: var(--accent);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--gray-600);
        }

        .strength-bar {
            width: 100%;
            height: 4px;
            background: var(--gray-300);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-indicator {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: width 0.3s, background 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="/logo.jpeg" alt="CVhive Logo" class="logo-svg">
                <div class="logo-text">CVhive</div>
            </div>
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password below</p>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@company.com" readonly>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required placeholder="Min 8 characters">
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-indicator" id="strengthIndicator"></div>
                        </div>
                        <span id="strengthText"></span>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password">
                    <div class="error-message" id="confirmError"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="buttonText">Reset Password</span>
                    <span class="loading" id="loading">⏳ Resetting...</span>
                </button>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="footer">
                Remember your password? <a href="/login">Log in</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            document.getElementById('formError').textContent = 'Invalid reset link';
            document.getElementById('formError').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        } else {
            document.getElementById('email').value = email;
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            let strength = 0;
            let color = '#ef4444';
            let text = 'Weak';

            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            if (strength === 1) { color = '#ef4444'; text = 'Weak'; }
            else if (strength === 2) { color = '#f5a623'; text = 'Fair'; }
            else if (strength === 3) { color = '#f08a00'; text = 'Good'; }
            else if (strength >= 4) { color = '#00c49a'; text = 'Strong'; }

            const indicator = document.getElementById('strengthIndicator');
            indicator.style.width = (strength * 25) + '%';
            indicator.style.background = color;
            document.getElementById('strengthText').textContent = text;
        });

        const form = document.getElementById('resetForm');
        const loading = document.getElementById('loading');
        const buttonText = document.getElementById('buttonText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Clear errors
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmError').textContent = 'Passwords do not match';
                document.getElementById('confirmError').style.display = 'block';
                return;
            }

            loading.classList.add('show');
            buttonText.style.display = 'none';

            try {
                const response = await fetch('/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        token,
                        newPassword: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('formError').textContent = data.error || 'Reset failed';
                    document.getElementById('formError').style.display = 'block';
                } else {
                    document.getElementById('successMessage').textContent = 'Password reset successfully! Redirecting...';
                    document.getElementById('successMessage').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                }
            } catch (error) {
                document.getElementById('formError').textContent = 'Network error. Please try again.';
                document.getElementById('formError').style.display = 'block';
            } finally {
                loading.classList.remove('show');
                buttonText.style.display = 'inline';
            }
        });
    </script>
</body>
</html>
