<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CVhive</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a56db;
            --secondary: #f5a623;
            --accent: #00c49a;
            --gray-100: #f1f4f8;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gray-100);
            color: var(--gray-600);
            line-height: 1.6;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .logo-svg {
            height: 45px;
            width: 45px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--gray-600);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .success-message {
            color: var(--accent);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            background: rgba(0, 196, 154, 0.1);
            padding: 1rem;
            border-radius: 8px;
        }

        .info-box {
            background: rgba(26, 86, 219, 0.05);
            border: 1px solid rgba(26, 86, 219, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .info-box i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg class="logo-svg" width="45" height="45" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 60 40 Q 40 40 40 100 Q 40 160 60 160 L 80 160 Q 85 160 85 155 L 85 145 Q 80 150 60 150 Q 50 150 50 100 Q 50 50 60 50 L 80 50 Q 85 50 85 45 L 85 35 Q 85 40 80 40 Z" fill="#0a1628"/>
                    <rect x="95" y="50" width="25" height="35" rx="3" fill="#f5a623"/>
                    <rect x="125" y="65" width="25" height="35" rx="3" fill="#f08a00"/>
                    <circle cx="110" cy="105" r="8" fill="#f5a623"/>
                    <circle cx="102" cy="100" r="3" fill="#ffffff"/>
                    <circle cx="118" cy="100" r="3" fill="#ffffff"/>
                    <circle cx="110" cy="110" r="3" fill="#ffffff"/>
                </svg>
                <div class="logo-text">CVhive</div>
            </div>
            
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <div class="info-box">
                ℹ️ Password reset link valid for 1 hour
            </div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="your@company.com">
                    <div class="error-message" id="emailError"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="buttonText">Send Reset Link</span>
                    <span class="loading" id="loading" style="display: none;">⏳ Sending...</span>
                </button>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="footer">
                Remember your password? <a href="/login">Log in</a> | <a href="/signup">Create account</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const loading = document.getElementById('loading');
        const buttonText = document.getElementById('buttonText');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;

            document.getElementById('formError').style.display = 'none';
            successMessage.style.display = 'none';

            loading.style.display = 'inline';
            buttonText.style.display = 'none';

            try {
                const response = await fetch('/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('formError').textContent = data.error || 'Request failed';
                    document.getElementById('formError').style.display = 'block';
                } else {
                    successMessage.textContent = '✓ Password reset link sent! Check your email and click the link within 1 hour.';
                    successMessage.style.display = 'block';
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 5000);
                }
            } catch (error) {
                document.getElementById('formError').textContent = 'Network error. Please try again.';
                document.getElementById('formError').style.display = 'block';
            } finally {
                loading.style.display = 'none';
                buttonText.style.display = 'inline';
            }
        });
    </script>
</body>
</html>
