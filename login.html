<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - CVhive</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a56db;
            --secondary: #f5a623;
            --accent: #00c49a;
            --gray-100: #f1f4f8;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gray-100);
            color: var(--gray-600);
            line-height: 1.6;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .logo-svg {
            height: 45px;
            width: 45px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--gray-600);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--gray-300);
            color: var(--primary);
        }

        .btn-secondary:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="/logo.jpeg" alt="CVhive Logo" class="logo-svg">
                <div class="logo-text">CVhive</div>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to your CVhive account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@company.com">
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div style="text-align: right; margin-bottom: 1.5rem; font-size: 0.9rem;">
                    <a href="/forgot-password" style="color: var(--primary-light); text-decoration: none;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="buttonText">Log In</span>
                    <span class="loading" id="loading">⏳ Logging in...</span>
                </button>

                <div class="error-message" id="formError"></div>
            </form>

            <div class="footer">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loading = document.getElementById('loading');
        const buttonText = document.getElementById('buttonText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Clear errors
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            loading.classList.add('show');
            buttonText.style.display = 'none';

            try {
                const response = await fetch('/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('formError').textContent = data.error || 'Login failed';
                    document.getElementById('formError').style.display = 'block';
                } else {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                document.getElementById('formError').textContent = 'Network error. Please try again.';
                document.getElementById('formError').style.display = 'block';
            } finally {
                loading.classList.remove('show');
                buttonText.style.display = 'inline';
            }
        });
    </script>
</body>
</html>
